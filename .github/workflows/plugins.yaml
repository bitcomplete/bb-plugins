name: plugins
on:
  push:
    paths:
      - .github/workflows/plugins.yaml
      - plugins/**
  pull_request:
    paths:
      - .github/workflows/plugins.yaml
      - plugins/**

jobs:
  quality_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: [devbox-provider, github-watcher, html-preview, image-copy, kubernetes-provider, linear, multi-repo, pr-inbox, repo-dashboard, slack, stewards, team-setup, thread-briefs, workstreams]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      # The same npm install bb's git plugin installer runs, without
      # --legacy-peer-deps: a peer conflict here fails `bb plugin install`.
      - name: Install as bb does
        run: npm install --dry-run --ignore-scripts --omit dev --omit optional --no-audit --no-fund
      - name: Install
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run --if-present typecheck
      - name: Test
        run: npm test
