name: diff-explorer
on:
  push:
    paths:
      - .github/workflows/diff-explorer.yaml
      - plugins/diff-explorer/**
  pull_request:
    paths:
      - .github/workflows/diff-explorer.yaml
      - plugins/diff-explorer/**

jobs:
  quality_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/diff-explorer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: plugins/diff-explorer/pnpm-lock.yaml
      - name: Check dependency pins
        run: node scripts/check-dependencies.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: |
          pnpm audit --audit-level=high
          npm audit --audit-level=high
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
