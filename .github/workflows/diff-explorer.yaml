name: diff-explorer
on:
  push:
    paths:
      - .github/workflows/diff-explorer.yaml
      - plugins/diff-explorer/**
  pull_request:
    paths:
      - .github/workflows/diff-explorer.yaml
      - plugins/diff-explorer/**

jobs:
  quality_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/diff-explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: plugins/diff-explorer/pnpm-lock.yaml
      - name: Check dependency pins
        run: node scripts/check-dependencies.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: |
          pnpm audit --audit-level=high
          npm audit --audit-level=high
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
